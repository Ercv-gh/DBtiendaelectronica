<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroStore - Gestión de Productos</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
   <h1>Bienvenido a la tienda</h1>  

    <div class="contenedor">

        <form id="formulari" action="../recibirProductos.php" method="post">

            <div class="cabecera">
                <h1>🖥️ ElectroStore</h1>
                <p>Alta de productos de electrónica</p>
            </div>

            <h2 class="section-title">Información General</h2>

            <label for="nom">Nombre del producto</label>
            <input type="text" id="nom" name="fnom" maxlength="50" required>

            <div class="form-row">

                <div>
                    <label for="categoria">Categoría</label>

                    <select id="categoria" name="fcategoria" required>

                        <option value="">Seleccione una categoría</option>

                        <option value="pantalla">Pantalla</option>
                        <option value="teclado">Teclado</option>
                        <option value="raton">Ratón</option>
                        <option value="portatil">Portátil</option>

                    </select>
                </div>

                <div>
                    <label for="marca">Marca</label>

                    <select id="marca" name="fmarca" required>

                        <option value="">
                            Seleccione una categoría primero
                        </option>

                    </select>
                </div>

            </div>

            <h2 class="section-title">Información Comercial</h2>

            <div class="form-row">

                <div>
                    <label for="preu">Precio (€)</label>
                    <input type="number"
                        id="preu"
                        name="fpreu"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <div>
                    <label for="quantitat">Cantidad</label>
                    <input type="number"
                        id="quantitat"
                        name="fquantitat"
                        min="0"
                        required>
                </div>

            </div>

            <h2 class="section-title">Descripción</h2>

            <textarea id="descripcio"
                name="fdescripcio"
                maxlength="150"
                placeholder="Describe el producto..."
                required></textarea>

            <p id="missatgeError"></p>

            <input type="submit" value="💾 Guardar Producto">

        </form>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
