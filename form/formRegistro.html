<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
        <!-- HEADER -->
    <header>
        <h1>🖥️ ElectroStore</h1>
        <p>Tu tienda de tecnología y electrónica de confianza</p>
    </header>

    <!-- NAV -->
    <nav>
        <ul>
            <li><a href="../index2.html">Inicio</a></li>
            <li><a href="../form/formConsultarPrecio.html">Consultar precio</a></li>
            <li><a href="../form/formDarDeBaja.html">Dar de Baja</a></li>
            <li><a href="../form/formActualizarPrecio.html">Actualizar Precio</a></li>
        </ul>
    </nav>

    <!-- CONTENIDO -->
    <main>
        <form id="formularioRegistro" action="../php/recibirRegistro.php" method="post">
            <div class="tituloFormulario">
                <h2>📦 Registro de Producto</h2>
                <p>Añade un nuevo producto al catálogo</p>
            </div>

            <div class="grupoFormulario">
                <label for="nom">Nombre del producto</label>
                <input type="text" id="nom" name="fnom" placeholder="Ej: Monitor LG UltraGear" required>
            </div>
            <div class="fila">
                <div class="grupoFormulario">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="fcategoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Pantalla">Pantalla</option>
                        <option value="Portátil">Portátil</option>
                        <option value="Teclado">Teclado</option>
                        <option value="Ratón">Ratón</option>
                        <option value="Impresora">Impresora</option>
                    </select>
                </div>

                <div class="grupoFormulario">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="fmarca" placeholder="Ej: LG" required>
                </div>

            </div>
            <div class="grupoFormulario">
                <label for="descripcio">Descripción</label>
                <textarea id="descripcio" name="fdescripcio" rows="5" placeholder="Describe las características principales del producto..." required></textarea>
            </div>

            <div class="fila">
                <div class="grupoFormulario">
                    <label for="preu">Precio (€)</label>
                    <input type="number" id="preu" name="fpreu" min="0" step="0.01" required>
                </div>

                <div class="grupoFormulario">
                    <label for="quantitat">Cantidad</label>
                    <input type="number" id="quantitat" name="fquantitat" min="0" required>
                </div>

            </div>
            <input type="submit" value="💾 Registrar Producto">
        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ElectroStore</p>
        <p>Gestión de Productos Electrónicos</p>
    </footer>

</body>

</html>
